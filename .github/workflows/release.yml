name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create a GitHub Release

jobs:
  release:
    name: Pack & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer reads the full tag history

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Spectral.Net.Analyzer.slnx

      - name: Build
        run: dotnet build Spectral.Net.Analyzer.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Spectral.Net.Analyzer.slnx --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack src/Spectral.Net.Analyzer/Spectral.Net.Analyzer.csproj --no-build --configuration Release --output nupkg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nupkg/*.nupkg
          generate_release_notes: true

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
